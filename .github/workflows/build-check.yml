name: Build check

on:
  pull_request:
    paths-ignore: [site/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile the app (Apple Silicon and Intel)
        run: |
          xcrun swiftc -O -parse-as-library -target arm64-apple-macos13.0 macos-app/Sources/*.swift -o "$RUNNER_TEMP/ui-arm64"
          xcrun swiftc -O -parse-as-library -target x86_64-apple-macos13.0 macos-app/Sources/*.swift -o "$RUNNER_TEMP/ui-x86_64"

  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Installer and hooks smoke test
        run: bash .github/scripts/starter-smoke.sh
      - name: Plugin is generated from the template
        run: node scripts/build-plugin.mjs --check
      - name: Validate plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate ./plugins/sarkhans-starter
